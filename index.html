<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Blog Manager</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>

body{
font-family:Poppins,sans-serif;
background:url("images/tumblr_inline_mlky878ojb1r53miq.png") no-repeat center center fixed;
background-size:cover;
padding:20px;
margin:0;
}

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.4);
z-index:-1;
}

.container{
max-width:800px;
margin:40px auto;
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

.nav{
margin-bottom:20px;
}

.nav a{
margin-right:15px;
text-decoration:none;
font-weight:bold;
color:#4a90e2;
}

#userHeader{
display:flex;
align-items:center;
gap:12px;
margin-bottom:20px;
padding-bottom:15px;
border-bottom:1px solid #eee;
}

input, textarea{
width:100%;
padding:10px;
margin-bottom:12px;
border-radius:6px;
border:1px solid #ddd;
box-sizing:border-box;
}

button{
padding:8px 14px;
cursor:pointer;
background:#4a90e2;
color:white;
border:none;
border-radius:6px;
transition:0.2s ease;
margin-right:5px;
}

button:hover{
background:#357abd;
}

.post{
background:white;
padding:18px;
margin-bottom:15px;
border-radius:12px;
box-shadow:0 4px 15px rgba(0,0,0,0.05);
}

.reply{
margin-top:10px;
padding:10px;
background:#f5f5f5;
border-radius:8px;
margin-left:40px;
}

.replyHeader{
display:flex;
align-items:center;
gap:8px;
margin-bottom:5px;
}

.replyInput{
margin-top:10px;
display:flex;
gap:8px;
}

.replyInput input{
flex:1;
margin:0;
}

/* ===== POST IMAGE STYLE ===== */
.postImage{
width:100%;
max-height:300px;
object-fit:cover;
border-radius:10px;
margin-top:10px;
}

/* ===== POST ACTIONS ===== */
.postActions{
margin-top:15px;
display:flex;
gap:8px;
}

.author-badge{
background:#e3f2fd;
color:#1976d2;
padding:2px 8px;
border-radius:12px;
font-size:12px;
margin-left:10px;
}

/* ===== IMAGE UPLOAD PREVIEW ===== */
.image-preview-container {
    margin-bottom: 15px;
    display: none;
}

.image-preview {
    max-width: 200px;
    max-height: 200px;
    border-radius: 8px;
    border: 2px solid #4a90e2;
    padding: 5px;
}

.remove-image {
    background: #ff4444;
    padding: 5px 10px;
    font-size: 12px;
    margin-left: 10px;
}

.remove-image:hover {
    background: #cc0000;
}

</style>
</head>

<body>

<div class="container">

<!-- Navigation -->
<div class="nav">
<a href="index.html">Home</a>
<a href="settings.html">Settings</a>
<a href="notifications.html">Notifications</a>
<a href="#" onclick="logout()">Logout</a>
</div>

<!-- User Header -->
<div id="userHeader"></div>

<h2 style="text-align:center">Home</h2>

<input type="text" id="title" placeholder="Post Title">
<textarea id="content" placeholder="Write post..."></textarea>

<!-- Image preview section -->
<div class="image-preview-container" id="imagePreviewContainer">
    <img id="imagePreview" class="image-preview" src="#" alt="Image preview">
    <button class="remove-image" onclick="removeImage()">✕ Remove Image</button>
</div>

<!-- Hidden file input for image upload -->
<input type="file" id="postImage" accept="image/*" style="display:none" onchange="previewImage(this)">

<!-- Image upload button -->
<button onclick="triggerImageUpload()">📷 Add Image</button>

<button onclick="addPost()">Add Post</button>

<hr>

<div id="posts"></div>

</div>

<script>

/* ===== LOGIN CHECK ===== */

let currentUser = JSON.parse(localStorage.getItem("currentUser"));

if(!currentUser){
window.location="login.html";
}

/* ===== USERS + POSTS ===== */

let users = JSON.parse(localStorage.getItem("users")) || [];
let posts = JSON.parse(localStorage.getItem("posts")) || [];

// Add authorEmail to existing posts if they don't have it (for backward compatibility)
posts = posts.map(post => {
    if (!post.authorEmail) {
        // Try to find the user by name, or use a default
        let user = users.find(u => u.name === post.author);
        post.authorEmail = user ? user.email : "unknown@email.com";
    }
    return post;
});
localStorage.setItem("posts", JSON.stringify(posts));

/* ===== IMAGE UPLOAD FUNCTIONS ===== */

let currentImageFile = null;

function triggerImageUpload(){
    // This opens the hidden file input when button is clicked
    document.getElementById("postImage").click();
}

function previewImage(input) {
    let previewContainer = document.getElementById("imagePreviewContainer");
    let preview = document.getElementById("imagePreview");
    
    if (input.files && input.files[0]) {
        currentImageFile = input.files[0];
        let reader = new FileReader();
        
        reader.onload = function(e) {
            preview.src = e.target.result;
            previewContainer.style.display = "block";
        }
        
        reader.readAsDataURL(input.files[0]);
    }
}

function removeImage() {
    document.getElementById("postImage").value = "";
    document.getElementById("imagePreviewContainer").style.display = "none";
    document.getElementById("imagePreview").src = "#";
    currentImageFile = null;
}

/* ===== PROFILE HEADER ===== */

document.getElementById("userHeader").innerHTML = `
<img src="${currentUser.image}" style="
width:50px;
height:50px;
border-radius:50%;
object-fit:cover;
border:2px solid #4a90e2;
">
<div>
<strong>${currentUser.name}</strong><br>
<small style="color:gray">${currentUser.email}</small>
</div>
`;

/* ===== DISPLAY POSTS ===== */

function displayPosts(){

let container = document.getElementById("posts");
container.innerHTML="";

posts.slice().reverse().forEach((post,index)=>{

let realIndex = posts.length-1-index;

if(!post.replies) post.replies = [];
if(!post.authorEmail) post.authorEmail = "unknown@email.com";

// Check if current user is the author of this post
let isAuthor = (post.authorEmail === currentUser.email);

let postHtml = `
<div class="post">

<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
<img src="${post.authorImage}" style="
width:35px;
height:35px;
border-radius:50%;
object-fit:cover;
">
<strong>${post.author}</strong>
${isAuthor ? '<span class="author-badge">You</span>' : ''}
</div>

<h3>${post.title}</h3>
<p>${post.content}</p>
${post.image ? `<img src="${post.image}" class="postImage">` : ""}

<!-- Replies -->
<div>
${post.replies.map(reply=>`
<div class="reply">
<div class="replyHeader">
<img src="${reply.image}" style="
width:25px;
height:25px;
border-radius:50%;
object-fit:cover;
">
<strong style="font-size:14px;">${reply.name}</strong>
</div>
<p style="font-size:14px;">${reply.text}</p>
</div>
`).join("")}
</div>

<!-- Reply Input (visible to everyone) -->
<div class="replyInput">
<input type="text" id="reply-${realIndex}" placeholder="Write reply...">
<button onclick="addReply(${realIndex})">Reply</button>
</div>
`;

// Only add delete and edit buttons if user is the author
if(isAuthor){
    postHtml += `
    <div class="postActions">
    <button onclick="deletePost(${realIndex})">Delete</button>
    <button onclick="editPost(${realIndex})">Edit</button>
    </div>
    `;
}

postHtml += `</div>`;

container.innerHTML += postHtml;

});

}

/* ===== ADD POST ===== */

function addPost(){

let title = document.getElementById("title").value.trim();
let content = document.getElementById("content").value.trim();
let imageURL = "";

if(title=="" && content==""){
alert("Fill post fields");
return;
}

/* Convert image to Base64 for storage */
if(currentImageFile){
    let reader = new FileReader();
    reader.onload = function(e) {
        imageURL = e.target.result;
        
        // Save post with the image URL
        savePost(title, content, imageURL);
    };
    reader.readAsDataURL(currentImageFile);
} else {
    // Save post without image
    savePost(title, content, "");
}

}

function savePost(title, content, imageURL) {
    /* Save post with author email */
    posts.push({
        title: title,
        content: content,
        image: imageURL,
        author: currentUser.name,
        authorEmail: currentUser.email,
        authorImage: currentUser.image,
        replies: []
    });

    localStorage.setItem("posts", JSON.stringify(posts));

    displayPosts();

    /* Clear inputs */
    document.getElementById("title").value = "";
    document.getElementById("content").value = "";
    removeImage(); // Clear image preview and file
}

/* ===== ADD REPLY ===== */

function addReply(index){

let input = document.getElementById(`reply-${index}`);
let text = input.value;

if(text=="") return;

posts[index].replies.push({
name:currentUser.name,
image:currentUser.image,
text:text
});

localStorage.setItem("posts",JSON.stringify(posts));

displayPosts();

// Clear the reply input
input.value = "";
}

/* ===== DELETE POST ===== */

function deletePost(index){

// Double-check if current user is the author before deleting
if(posts[index].authorEmail !== currentUser.email){
    alert("You can only delete your own posts!");
    return;
}

if(confirm("Are you sure you want to delete this post?")){
    posts.splice(index,1);
    localStorage.setItem("posts",JSON.stringify(posts));
    displayPosts();
}
}

/* ===== EDIT POST ===== */

function editPost(index){

// Double-check if current user is the author before editing
if(posts[index].authorEmail !== currentUser.email){
    alert("You can only edit your own posts!");
    return;
}

document.getElementById("title").value = posts[index].title;
document.getElementById("content").value = posts[index].content;

// If there's an image, show it in preview
if(posts[index].image) {
    let previewContainer = document.getElementById("imagePreviewContainer");
    let preview = document.getElementById("imagePreview");
    preview.src = posts[index].image;
    previewContainer.style.display = "block";
    
    // Convert base64 to file (simplified - just store the base64)
    currentImageFile = posts[index].image;
}

// Remove the old post
posts.splice(index,1);
localStorage.setItem("posts",JSON.stringify(posts));

displayPosts();
}

/* ===== LOGOUT ===== */

function logout(){
localStorage.removeItem("currentUser");
window.location="login.html";
}

displayPosts();

</script>

</body>
</html>
