<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Notifications</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>

body{
font-family:Poppins,sans-serif;
background:url(images/tumblr_inline_mlky878ojb1r53miq.png);
padding:30px;
margin:0;
}

.container{
max-width:700px;
margin:auto;
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

.notification{
padding:15px;
border-bottom:1px solid #eee;
}

.unread{
background:#eef3ff;
}

h2{
text-align:center;
}

.back{
display:block;
margin-top:20px;
text-align:center;
text-decoration:none;
color:#4a90e2;
font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<h2>Notifications</h2>

<div id="notificationList"></div>

<a href="index.html" class="back">← Back to Home</a>

</div>

<script>

/* ===== LOGIN USER ===== */

let currentUser = JSON.parse(localStorage.getItem("currentUser"));

if(!currentUser){
window.location="login.html";
}

/* ===== LOAD NOTIFICATIONS ===== */

function loadNotifications(){

let notifications = JSON.parse(localStorage.getItem("notifications")) || [];

let container = document.getElementById("notificationList");

let myNotifications = notifications.filter(n =>
n.to === currentUser.email
);

if(myNotifications.length === 0){
container.innerHTML = "<p style='text-align:center'>No notifications yet.</p>";
return;
}

/* Mark as read */

notifications.forEach(n=>{
if(n.to === currentUser.email){
n.read = true;
}
});

localStorage.setItem("notifications",JSON.stringify(notifications));

/* Display notifications */

container.innerHTML="";

myNotifications.slice().reverse().forEach(n=>{

container.innerHTML += `
<div class="notification ${n.read ? "" : "unread"}">
<p>${n.message}</p>
<small>${n.time}</small>
</div>
`;

});

}

loadNotifications();

</script>

</body>
</html>
